<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小阿尔卡纳 · 三张牌</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="masthead">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" width="26" height="26" fill="currentColor">
          <path d="M24 5 L29 18 L43 18 L32 27 L36 41 L24 32 L12 41 L16 27 L5 18 L19 18 Z"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>小阿尔卡纳</h1>
        <p>Minor Arcana · 三张牌</p>
      </div>
    </header>

    <main>
      <section id="theme-screen" class="screen active">
        <div class="step-row">
          <span class="step-index">壹</span>
          <span class="step-name">选择方向</span>
        </div>
        <h2 class="screen-title">你想先了解哪个方向？</h2>
        <div id="theme-grid" class="theme-grid"></div>
      </section>

      <section id="reading-screen" class="screen">
        <div class="reading-top">
          <button id="change-theme-btn" class="text-button" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 12H5M11 18l-6-6 6-6"/>
            </svg>
            更换主题
          </button>
          <div id="theme-banner" class="theme-banner"></div>
        </div>

        <div id="cards-row" class="cards-row"></div>

        <div class="draw-area">
          <button id="draw-btn" class="primary-button" type="button">洗牌并抽三张</button>
        </div>

        <div id="overall" class="overall" hidden></div>
      </section>
    </main>
    <footer class="attribution">牌面：Pamela Colman Smith 绘，公有领域 · 来源 Wikimedia Commons</footer>
  </div>

  <script src="cards.js"></script>
  <script src="app.js"></script>
</body>
</html>
